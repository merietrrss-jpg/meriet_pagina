  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 15% 8%, rgba(176,48,214,.75), transparent 45%),
      radial-gradient(circle at 90% 35%, rgba(255,90,140,.55), transparent 50%),
      radial-gradient(circle at 10% 75%, rgba(255,150,40,.55), transparent 50%),
      radial-gradient(circle at 90% 95%, rgba(60,200,230,.45), transparent 45%),

    mix-blend-mode: normal;
  }

  .avatar {
    width: 120px; height: 120px; border-radius: 50%; overflow: hidden;
    border: 4px solid var(--ring);
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .handle { color: #ffffff;
    margin-top: 14px; font-size: 24px; font-weight: 600;
    letter-spacing: .02em; text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .bio { color: #ffffff; margin-top: 2px; font-size: 14px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; opacity: .9; text-shadow: 0 1px 6px rgba(0,0,0,.35); }

  .links { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 30px; }
  .links a {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    min-height: 68px; padding: 8px 64px;
    background: var(--pill); color: var(--text); text-decoration: none;
    border-radius: 999px;
    font-size: 18px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; text-align: center; line-height: 1.15;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
    transition: transform .15s ease, background .15s ease;
  }
  .links a:hover, .links a:focus-visible { transform: scale(1.025); background: var(--pill-hi); outline: none; }
  .links a:focus-visible { box-shadow: 0 0 0 3px var(--ring); }
  .thumb {
    position: absolute; left: 7px; top: 50%; transform: translateY(-50%);
    width: 54px; height: 54px; border-radius: 50%; overflow: hidden;
    border: 2px solid var(--ring); background: var(--hot); color: var(--hot-text);
    display: grid; place-items: center;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb svg { width: 26px; height: 26px; }

  .links a.hot { background: var(--hot); color: var(--hot-text); font-weight: 600; font-size: 19px; }
  .links a.hot:hover, .links a.hot:focus-visible { background: #f3fba8; }
  .links a.hot .thumb { border-color: var(--hot-text); }
  .links a .small { display: block; font-size: 12px; letter-spacing: .16em; opacity: .65; font-weight: 500; }

  footer { color: #ffffff; margin-top: 36px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: .8; text-shadow: 0 1px 6px rgba(0,0,0,.35); }

  @media (prefers-reduced-motion: reduce) { .links a { transition: none; } }
</style>
